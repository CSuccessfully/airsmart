<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #e8f4f8; min-height: 100vh; padding: 20px 16px 32px; }

  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .greeting { font-size: 13px; color: #5a8a9f; letter-spacing: 0.3px; font-weight: 500; }
  .status-pill { display: flex; align-items: center; gap: 6px; background: white; border-radius: 20px; padding: 5px 12px 5px 8px; border: 1.5px solid #c2dfe8; }
  .status-pill.online .dot { background: #10b981; box-shadow: 0 0 0 3px #10b98122; }
  .status-pill.offline .dot { background: #f43f5e; box-shadow: 0 0 0 3px #f43f5e22; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-pill span { font-size: 12px; color: #1e6080; font-weight: 500; }

  .wave { display: block; width: 100%; margin-bottom: 20px; }

  .big-num-card { border-radius: 22px; padding: 22px 22px 18px; margin-bottom: 12px; position: relative; overflow: hidden; }
  .big-num-card.hum { background: linear-gradient(135deg, #0e7490, #0891b2); }
  .big-num-card.temp { background: linear-gradient(135deg, #065f46, #059669); }
  .card-label { font-size: 11px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 12px; opacity: 0.7; color: white; }
  .card-value { font-family: 'DM Mono', monospace; font-size: 58px; font-weight: 400; line-height: 1; color: white; }
  .card-unit { font-size: 24px; opacity: 0.6; margin-left: 2px; }
  .bar-track { height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 18px; }
  .bar-fill { height: 100%; border-radius: 2px; background: rgba(255,255,255,0.7); }
  .circle-deco { position: absolute; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.1); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .small-card { background: white; border-radius: 16px; padding: 16px; border: 1.5px solid #c8e6f0; }
  .small-label { font-size: 10px; color: #5a8a9f; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; font-weight: 500; }
  .small-val { font-family: 'DM Mono', monospace; font-size: 28px; color: #0e4f6b; font-weight: 400; }
  .small-unit { font-size: 14px; color: #7ab0c4; }

  .fan-card { background: #0c4a6e; border-radius: 18px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border: 1.5px solid #0369a1; }
  .fan-title { font-size: 15px; font-weight: 500; color: white; }
  .fan-sub { font-size: 12px; color: #7dd3fc; margin-top: 3px; }
  .fan-badge { font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 20px; background: #10b98122; color: #6ee7b7; border: 1px solid #10b98144; }
  .fan-badge.inactive { background: #ffffff11; color: #94a3b8; border-color: #ffffff22; }
</style>
</head>
<body>

<div class="top-row">
  <div class="greeting">Control de humedad</div>
  <div class="status-pill ESTADO_CLASS">
    <div class="dot"></div>
    <span>ESTADO_TEXTO</span>
  </div>
</div>

<svg class="wave" viewBox="0 0 340 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M0 20 Q25 6 50 18 Q75 28 100 12 Q125 0 150 16 Q175 28 200 10 Q225 0 250 18 Q275 28 300 12 Q320 4 340 16" stroke="#0891b2" stroke-width="1.5" fill="none" opacity="0.35"/>
  <path d="M0 26 Q30 14 60 22 Q90 28 120 18 Q150 8 180 22 Q210 28 240 16 Q270 6 300 20 Q320 26 340 20" stroke="#059669" stroke-width="1" fill="none" opacity="0.25"/>
  <circle cx="150" cy="16" r="3.5" fill="#0891b2" opacity="0.5"/>
  <circle cx="250" cy="18" r="2.5" fill="#059669" opacity="0.4"/>
</svg>

<div class="big-num-card hum">
  <div class="circle-deco" style="width:120px;height:120px;top:-40px;right:-30px;"></div>
  <div class="circle-deco" style="width:60px;height:60px;bottom:-10px;right:60px;"></div>
  <div class="card-label">Humedad</div>
  <div class="card-value">VALOR_HUM<span class="card-unit">%</span></div>
  <div class="bar-track"><div class="bar-fill" style="width:VALOR_HUM%"></div></div>
</div>

<div class="big-num-card temp">
  <div class="circle-deco" style="width:100px;height:100px;top:-30px;right:-20px;"></div>
  <div class="circle-deco" style="width:50px;height:50px;bottom:-5px;left:40px;"></div>
  <div class="card-label">Temperatura</div>
  <div class="card-value">VALOR_TEMP<span class="card-unit">°C</span></div>
  <div class="bar-track"><div class="bar-fill" style="width:VALOR_TEMP%"></div></div>
</div>

<div class="two-col">
  <div class="small-card">
    <div class="small-label">Uso activo</div>
    <div class="small-val">VALOR_TIEMPO<span class="small-unit"> s</span></div>
  </div>
  <div class="small-card">
    <div class="small-label">Umbral hum.</div>
    <div class="small-val">65<span class="small-unit"> %</span></div>
  </div>
</div>

<div class="fan-card">
  <div>
    <div class="fan-title">Ventilador</div>
    <div class="fan-sub">Extracción activa</div>
  </div>
  <div class="fan-badge">Activo</div>
</div>

</body>
</html>
