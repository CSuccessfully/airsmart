<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, #072f47 0%, #0c5a73 35%, #1a8aa8 65%, #4ab0c8 100%);
    padding: 20px 16px 32px;
    position: relative;
    overflow-x: hidden;
  }

  .waves-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .wave-layer {
    position: absolute;
    width: 200%;
    left: -50%;
  }

  .wave1 { top: 18%; animation: waveMove 8s ease-in-out infinite; opacity: 0.18; }
  .wave2 { top: 28%; animation: waveMove 11s ease-in-out infinite reverse; opacity: 0.12; }
  .wave3 { top: 38%; animation: waveMove 14s ease-in-out infinite; opacity: 0.09; }

  @keyframes waveMove {
    0%   { transform: translateX(0); }
    50%  { transform: translateX(8%); }
    100% { transform: translateX(0); }
  }

  .content { position: relative; z-index: 1; }

  .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .greeting { font-size: 13px; color: rgba(255,255,255,0.75); letter-spacing: 0.3px; font-weight: 500; }
  .status-pill { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); border-radius: 20px; padding: 5px 12px 5px 8px; border: 1px solid rgba(255,255,255,0.25); }
  .status-pill.offline .dot { background: #f43f5e; box-shadow: 0 0 0 3px #f43f5e33; }
  .status-pill.online .dot { background: #10b981; box-shadow: 0 0 0 3px #10b98133; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-pill span { font-size: 12px; color: white; font-weight: 500; }

  .big-num-card { border-radius: 22px; padding: 22px 22px 18px; margin-bottom: 12px; position: relative; overflow: hidden; background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.2); }
  .card-label { font-size: 11px; font-weight: 500; letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 12px; opacity: 0.7; color: white; }
  .card-value { font-family: 'DM Mono', monospace; font-size: 58px; font-weight: 400; line-height: 1; color: white; }
  .card-value.waiting { font-size: 42px; opacity: 0.45; }
  .card-unit { font-size: 24px; opacity: 0.6; margin-left: 2px; }
  .bar-track { height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; margin-top: 18px; }
  .bar-fill { height: 100%; border-radius: 2px; background: rgba(255,255,255,0.5); }
  .circle-deco { position: absolute; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .small-card { background: rgba(255,255,255,0.12); backdrop-filter: blur(12px); border-radius: 16px; padding: 16px; border: 1px solid rgba(255,255,255,0.18); }
  .small-label { font-size: 10px; color: rgba(255,255,255,0.6); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; font-weight: 500; }
  .small-val { font-family: 'DM Mono', monospace; font-size: 28px; color: white; font-weight: 400; }
  .small-val.waiting { opacity: 0.35; font-size: 22px; }
  .small-unit { font-size: 14px; opacity: 0.6; }

  .fan-card { background: rgba(0,0,0,0.25); backdrop-filter: blur(12px); border-radius: 18px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.1); }
  .fan-title { font-size: 15px; font-weight: 500; color: white; }
  .fan-sub { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 3px; }
  .fan-badge { font-size: 11px; font-weight: 500; padding: 5px 12px; border-radius: 20px; }
  .fan-badge.active { background: #10b98122; color: #6ee7b7; border: 1px solid #10b98144; }
  .fan-badge.inactive { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.15); }
</style>
</head>
<body>

<div class="waves-bg">
  <svg class="wave-layer wave1" viewBox="0 0 1440 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0,60 C180,100 360,20 540,60 C720,100 900,20 1080,60 C1260,100 1380,40 1440,60 L1440,120 L0,120 Z" fill="rgba(255,255,255,0.15)"/>
  </svg>
  <svg class="wave-layer wave2" viewBox="0 0 1440 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0,40 C200,80 400,10 600,50 C800,90 1000,10 1200,50 C1320,70 1400,30 1440,50 L1440,120 L0,120 Z" fill="rgba(255,255,255,0.1)"/>
  </svg>
  <svg class="wave-layer wave3" viewBox="0 0 1440 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <path d="M0,70 C150,30 350,90 550,50 C750,10 950,80 1150,40 C1300,20 1400,60 1440,40 L1440,120 L0,120 Z" fill="rgba(255,255,255,0.07)"/>
  </svg>
</div>

<div class="content">

  <div class="top-row">
    <div class="greeting">Control de humedad</div>
    <div class="status-pill offline">
      <div class="dot"></div>
      <span>Sin señal</span>
    </div>
  </div>

  <div class="big-num-card hum">
    <div class="circle-deco" style="width:120px;height:120px;top:-40px;right:-30px;"></div>
    <div class="circle-deco" style="width:60px;height:60px;bottom:-10px;right:60px;"></div>
    <div class="card-label">Humedad</div>
    <div class="card-value waiting">En espera</div>
    <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
  </div>

  <div class="big-num-card temp">
    <div class="circle-deco" style="width:100px;height:100px;top:-30px;right:-20px;"></div>
    <div class="circle-deco" style="width:50px;height:50px;bottom:-5px;left:40px;"></div>
    <div class="card-label">Temperatura</div>
    <div class="card-value waiting">En espera</div>
    <div class="bar-track"><div class="bar-fill" style="width:0%"></div></div>
  </div>

  <div class="two-col">
    <div class="small-card">
      <div class="small-label">Uso activo</div>
      <div class="small-val waiting">-- <span class="small-unit">s</span></div>
    </div>
    <div class="small-card">
      <div class="small-label">Ventilador</div>
      <div class="small-val waiting">--</div>
    </div>
  </div>

  <div class="fan-card">
    <div>
      <div class="fan-title">Ventilador</div>
      <div class="fan-sub">En espera</div>
    </div>
    <div class="fan-badge inactive">Inactivo</div>
  </div>

</div>
</body>
</html>
