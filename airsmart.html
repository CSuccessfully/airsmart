<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }
  .header { background: #2196F3; padding: 20px 20px 16px; }
  .header h1 { color: white; font-size: 22px; font-weight: 700; }
  .header p { color: rgba(255,255,255,0.85); font-size: 13px; margin-top: 3px; }
  .content { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: white; border-radius: 14px; padding: 16px 18px; display: flex; align-items: center; gap: 14px; border: 1.5px solid #e0e0e0; }
  .card.green { border-color: #4CAF50; background: #f0faf0; }
  .icon-circle { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; background: #e8f5e9; }
  .card-text h3 { font-size: 15px; font-weight: 600; color: #1a1a1a; }
  .card-text p { font-size: 12px; color: #555; margin-top: 3px; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metric-card { background: white; border-radius: 14px; padding: 20px 12px; text-align: center; border: 1px solid #e8e8e8; }
  .metric-icon { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; margin: 0 auto 10px; }
  .metric-icon.hum { background: #e3f2fd; }
  .metric-icon.temp { background: #e8f5e9; }
  .metric-label { font-size: 13px; color: #888; margin-bottom: 6px; }
  .metric-value { font-size: 30px; font-weight: 700; }
  .metric-value.blue { color: #1565C0; }
  .metric-value.green { color: #2E7D32; }
  .info-card { background: #f0f4ff; border-radius: 14px; padding: 14px 18px; border: 1px solid #c5d3f5; display: flex; align-items: flex-start; gap: 10px; }
  .info-card h4 { font-size: 14px; font-weight: 600; color: #1565C0; }
  .info-card p { font-size: 12px; color: #555; margin-top: 3px; line-height: 1.5; }
</style>
</head>
<body>

<div class="header">
  <h1>AirSmart</h1>
  <p>Control de extracción de humedad</p>
</div>

<div class="content">

  <div class="card green">
    <div class="icon-circle">✅</div>
    <div class="card-text">
      <h3>Sistema activo</h3>
      <p>⚡ Energía eléctrica / solar</p>
    </div>
  </div>

  <div class="card green">
    <div class="icon-circle">💨</div>
    <div class="card-text">
      <h3>Ventilador</h3>
      <p>Extrayendo humedad</p>
    </div>
  </div>

  <div class="metrics">
    <div class="metric-card">
      <div class="metric-icon hum">💧</div>
      <div class="metric-label">Humedad</div>
      <div class="metric-value blue">VALOR_HUM%</div>
    </div>
    <div class="metric-card">
      <div class="metric-icon temp">🌡️</div>
      <div class="metric-label">Temperatura</div>
      <div class="metric-value green">VALOR_TEMP°C</div>
    </div>
  </div>

  <div class="info-card">
    <span style="font-size:20px;">💨</span>
    <div>
      <h4>Funcionamiento automático</h4>
      <p>El ventilador se activa cuando la humedad supera el 65%</p>
    </div>
  </div>

</div>
</body>
</html>
